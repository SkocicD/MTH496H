<div class="flex flex-col h-screen">

  <!-- Canvas -->
  <canvas #canvas class="flex-1 border border-gray-400"></canvas>

  <!-- Bottom controls -->
  <div class="flex justify-around p-3 border-t bg-gray-100">
    <button
      (click)="toggle('hull')"
      [ngClass]="getButtonClass('hull', 'blue')">
      Convex Hull
    </button>

    <button
      (click)="toggle('delaunay')"
      [ngClass]="getButtonClass('delaunay', 'green')">
      Delaunay
    </button>

    <button
      (click)="toggle('voronoi')"
      [ngClass]="getButtonClass('voronoi', 'red')">
      Voronoi
    </button>

    <button
      (click)="toggle('crust')"
      [ngClass]="getButtonClass('crust', 'purple')">
      Crust
    </button>
  </div>

</div>
